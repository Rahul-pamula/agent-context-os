name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so generate-repo-map.sh reads real per-file git dates

      - name: Run skill validation
        run: |
          chmod +x scripts/validate-skills.sh
          ./scripts/validate-skills.sh

      - name: Check for broken local links
        run: |
          chmod +x scripts/check-links.sh
          bash scripts/check-links.sh

      - name: Check REPO_MAP.md is up to date
        run: |
          chmod +x scripts/generate-repo-map.sh
          bash scripts/generate-repo-map.sh
          # Ignore the volatile "Generated: <date> | Commit: <hash>" header — it
          # embeds the current HEAD hash, which the committed file can never match
          # (the file lives inside the commit). Gate only on the file/tree content.
          if ! git diff --quiet -I '^Generated:' REPO_MAP.md; then
            echo "REPO_MAP.md is out of date. Run: bash scripts/generate-repo-map.sh"
            echo ""
            git diff -I '^Generated:' REPO_MAP.md
            exit 1
          fi
          echo "REPO_MAP.md is current."
